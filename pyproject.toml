[project]
name = "civitas-contrib-workspace"
version = "0.1.0"
description = "Community integrations and extras for Civitas — workspace root"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.12"
authors = [{ name = "Jeryn Mathew Varghese" }]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
only-include = ["_nonexistent"]

[tool.uv.sources]
civitas-contrib = { workspace = true }

[tool.uv.workspace]
members = ["packages/*"]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "mypy>=1.11",
    "ruff>=0.8",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["civitas_contrib"]

[tool.mypy]
python_version = "3.12"
strict = true

[[tool.mypy.overrides]]
# Optional third-party SDKs behind civitas-contrib's own extras — each import
# is guarded by a try/except ImportError at runtime (see e.g.
# plugins/anthropic.py's _HAS_ANTHROPIC flag). CI intentionally does not
# install every extra for every run, so mypy has no stubs to resolve these
# against. Matches the identical, established precedent in
# civitas-io/python-civitas's own root pyproject.toml.
module = [
    "openai",
    "openai.*",
    "google",
    "google.*",
    "mistralai",
    "mistralai.*",
    "agents",
    "agents.*",
    "asyncpg",
    "asyncpg.*",
    "aiomysql",
    "aiomysql.*",
]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# Eval exporter SDKs: optional installs, no stubs bundled with the packages.
module = [
    "langfuse",
    "langfuse.*",
    "braintrust",
    "braintrust.*",
    "langsmith",
    "langsmith.*",
    "fiddler",
    "fiddler.*",
    "opentelemetry",
    "opentelemetry.*",
]
ignore_missing_imports = true
