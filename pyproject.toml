[tool.uv.workspace]
members = ["packages/*"]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "mypy>=1.11",
    "ruff>=0.8",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["fabrica", "civitas_contrib"]

[tool.mypy]
python_version = "3.12"
strict = true

[[tool.mypy.overrides]]
# mcp is an OPTIONAL runtime dependency of packages/fabrica (fabrica[mcp]),
# guarded by a try/except ImportError at import time (fabrica/mcp/client.py's
# _HAS_MCP flag) -- CI intentionally does not install every optional extra
# for every package, so mypy has no stubs to resolve this against. Ignoring
# missing imports here is the correct match for an optional dependency, not
# a workaround: forcing CI to install every current and future optional
# extra just to satisfy mypy would couple CI to a package's whole
# optional-dependency surface, not just its required one.
module = "mcp.*"
ignore_missing_imports = true
