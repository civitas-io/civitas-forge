[project]
name = "civitas-contrib"
version = "0.2.0"
description = "Community integrations and extras for Civitas — adapters, providers, eval exporters"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
authors = [{ name = "Jeryn Mathew Varghese" }]
keywords = ["agents", "llm", "civitas", "langraph", "anthropic", "openai"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    # >=0.11.0: SQLiteStateStore moved to core (B4); the sqlite_store shim here
    # re-exports it from civitas.plugins.sqlite_store.
    "civitas>=0.11.0",
]

[project.optional-dependencies]
anthropic  = ["anthropic>=0.20"]
openai     = ["openai>=1.0"]
gemini     = ["google-generativeai>=0.8"]
mistral    = ["mistralai>=1.0"]
langgraph  = ["langgraph>=0.1"]
postgres   = ["asyncpg>=0.29"]
# cryptography: aiomysql needs it for MySQL 8's default caching_sha2_password auth.
mysql      = ["aiomysql>=0.2", "cryptography>=42"]
otel       = ["opentelemetry-sdk>=1.20", "opentelemetry-exporter-otlp-proto-grpc>=1.20"]
arize      = ["opentelemetry-sdk>=1.20", "opentelemetry-exporter-otlp-proto-grpc>=1.20"]
langfuse   = ["langfuse>=2.0"]
braintrust = ["braintrust>=0.0.100"]
langsmith  = ["langsmith>=0.1"]
# fiddler-client backs eval.exporters.FiddlerExporter, not a model provider —
# there is no civitas_contrib.plugins.fiddler.
fiddler    = ["fiddler-client>=3.0"]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "ruff>=0.4",
    "mypy>=1.10",
    "anthropic>=0.20",
    "openai>=1.0",
    "opentelemetry-sdk>=1.20",
    "types-pyyaml>=6.0.12",
    # Real-DB integration tests spin up Postgres/MySQL containers.
    "testcontainers>=4.0",
    "asyncpg>=0.29",
    "aiomysql>=0.2",
]

[project.urls]
Homepage = "https://github.com/civitas-io/civitas-contrib"
Repository = "https://github.com/civitas-io/civitas-contrib"
Issues = "https://github.com/civitas-io/civitas-contrib/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/civitas_contrib"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]
